# SPDX-License-Identifier: GPL-3.0-or-later
name: Link CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Linux uses the organisation pool; Windows retains native ARM64 coverage on a managed image.
jobs:
  portable-core:
    name: ${{ matrix.os }} / strict C11
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            runner: [self-hosted, Linux, X64, linux-native]
          - os: macos-latest
            runner: macos-latest
          - os: windows-11-arm
            runner: windows-11-arm

    steps:
      - name: Provide Git on self-hosted Linux
        if: runner.os == 'Linux' && runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          if command -v git >/dev/null; then exit 0; fi
          root="$RUNNER_TEMP/link-git"
          mkdir -p "$root/packages"
          cd "$root/packages"
          apt-get download git
          dpkg-deb -x ./*.deb "$root"
          "$root/usr/bin/git" --version
          echo "$root/usr/bin" >> "$GITHUB_PATH"
          echo "GIT_EXEC_PATH=$root/usr/lib/git-core" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Provide CMake on self-hosted Linux
        if: runner.os == 'Linux' && runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          if command -v cmake >/dev/null; then exit 0; fi
          root="$RUNNER_TEMP/link-cmake"
          mkdir -p "$root/packages"
          cd "$root/packages"
          apt-get download cmake cmake-data librhash0 libjsoncpp25 libuv1t64
          for deb in ./*.deb; do dpkg-deb -x "$deb" "$root"; done
          export LD_LIBRARY_PATH="$root/usr/lib/x86_64-linux-gnu${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          "$root/usr/bin/cmake" --version
          echo "$root/usr/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Verify release ownership
        shell: bash
        run: |
          set -euo pipefail
          release=.github/workflows/release.yml
          grep -Fq 'workflow_run:' "$release"
          grep -Fq 'run-id: ${{ github.event.workflow_run.id }}' "$release"
          grep -Fq 'actions/download-artifact@' "$release"
          if grep -Eq 'head_commit.message|cmake --build|ctest ' "$release"; then
            echo "Publication must consume qualified artifacts without commit-prose controls or a second build graph." >&2
            exit 1
          fi
          test ! -e .github/workflows/prune-audited-branch.yml
          test ! -e .github/workflows/cancel-stale-runs.yml

      - name: Keep Release tests executable
        shell: bash
        run: |
          set -euo pipefail
          if grep -REn --include='*.c' --include='*.h' \
              -e '#[[:space:]]*include[[:space:]]*<assert\.h>' \
              -e '(^|[^[:alnum:]_])assert[[:space:]]*\(' tests; then
            echo "Link tests must not depend on assert(); Release builds define NDEBUG." >&2
            exit 1
          fi

      - name: Initialise and verify exact Common dependency
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init src/infiltratr-common
          expected_version="$(grep -F 'set(LINK_COMMON_VERSION "' CMakeLists.txt | head -n 1 | cut -d'"' -f 2)"
          expected_commit="$(git ls-tree HEAD src/infiltratr-common | awk '{print $3}')"
          found_version="$(tr -d '[:space:]' < src/infiltratr-common/VERSION)"
          found_commit="$(git -C src/infiltratr-common rev-parse HEAD)"
          printf 'Common expected %s %s; found %s %s\n' \
            "$expected_version" "$expected_commit" "$found_version" "$found_commit"
          test -n "$expected_version"
          test -n "$expected_commit"
          test "$found_version" = "$expected_version"
          test "$found_commit" = "$expected_commit"

      - name: Enforce transport and evidence regressions
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'LinkRecoveryAttemptLimit' platform/apple/LinkBLETransport.m
          grep -Fq '_recoveryAttempt > LinkRecoveryAttemptLimit' platform/apple/LinkBLETransport.m
          grep -Fq 'retry limit reached' platform/apple/LinkBLETransport.m
          grep -Fq 'LinkScanAttemptLimit = 4U' platform/apple/LinkBLETransport.m
          grep -Fq 'isCompatiblePeripheralName' platform/apple/LinkBLETransport.m
          if grep -Fq 'guard LinkBLETransport.isCompatiblePeripheralName(displayName)' platform/apple/LinkDiagnosticUI.swift || \
             grep -Fq '.filter { $0.identifier != knownAdapterIdentifier }' platform/apple/LinkDiagnosticUI.swift; then
            echo 'The manual connection picker must show every discovered device, including the saved adapter.' >&2
            exit 1
          fi
          grep -Fq 'CBCentralManagerScanOptionAllowDuplicatesKey: true' platform/apple/LinkDiagnosticUI.swift
          grep -Fq 'LinkKnownPeripheralConnectTimeoutSeconds = 3.0' platform/apple/LinkBLETransport.m
          grep -Fq 'Saved BLE adapter did not answer yet; scanning' platform/apple/LinkBLETransport.m
          grep -Fq 'retrievePeripheralsWithIdentifiers' platform/apple/LinkBLETransport.m
          grep -Fq 'LinkKnownPeripheralDefaultsKey' platform/apple/LinkBLETransport.m
          grep -Fq 'link_telemetry_recorder_begin(' platform/apple/LinkAppleTelemetryRecorder.inc
          grep -Fq '"BLE", stateName.UTF8String' platform/apple/LinkAppleTelemetryRecorder.inc
          grep -Fq 'LinkBLETransportStateFailed' platform/apple/LinkDiagnosticsController.m
          grep -Fq 'case LINK_DIAGNOSTIC_FLOW_EVENT_LIVE_STRUCTURED:' platform/apple/LinkDiagnosticsController.m
          grep -Fq 'event.kind == LINK_DIAGNOSTIC_FLOW_EVENT_LIVE_STRUCTURED' platform/linux/link-gtk-shell.c
          grep -Fq 'LINK_ADAPTER_KIND_MERCEDES_ME_NATIVE' include/link/transport.h
          grep -Fq 'link_adapter_kind_from_bluetooth_name' src/core/transport.c
          grep -Fq 'LINK_MERCEDES_ME_NUS_SERVICE_UUID' include/link/mercedes_me_adapter.h
          grep -Fq 'LINK_MERCEDES_ME_REFERENCE_CLASSIC_CONNECT_TIMEOUT_MS 44000U' include/link/mercedes_me_adapter.h
          grep -Fq 'link_mercedes_me_adapter_family_from_name' src/core/mercedes_me_adapter.c
          for path in \
            include/link/mercedes_me_data_ids.h \
            include/link/mercedes_me_diaglogic.h \
            include/link/mercedes_me_whisper.h \
            src/core/mercedes_me_data_ids.c \
            src/core/mercedes_me_diaglogic.c \
            src/core/mercedes_me_whisper.c \
            tests/test_mercedes_me_data_ids.c \
            tests/test_mercedes_me_diaglogic.c \
            tests/test_mercedes_me_whisper.c \
            docs/MERCEDES-ME-DATA-IDS.md; do
            if [[ -e "$path" ]]; then
              echo "Manufacturer-specific Mercedes me semantics must live in MBLink, not Link: $path" >&2
              exit 1
            fi
          done
          grep -Fq 'link-test-mercedes-me-adapter tests/test_mercedes_me_adapter.c link-mercedes-me-adapter' CMakeLists.txt
          grep -Fq 'link-test-mercedes-me-native-protocol tests/test_mercedes_me_native_protocol.c link-mercedes-me-native-protocol' CMakeLists.txt
          grep -Fq 'link_mercedes_me_secure_encode' src/core/mercedes_me_native_protocol.c
          grep -Fq 'LINK_MERCEDES_ME_SECURE_MAX_PLAINTEXT 505U' include/link/mercedes_me_native_protocol.h
          grep -Fq 'docs/MERCEDES-ME-NATIVE-BINARIES.md' README.md
          grep -Fq 'docs/MERCEDES-ME-ADAPTER-INTEROP.md' README.md
          grep -Fq 'link_linux_serial_probe_adapter' platform/linux/link-gtk-shell.c
          grep -Fq 'typedef struct LinkAboutInfo' include/link/about.h
          grep -Fq 'const LinkAboutInfo *about;' platform/linux/link-gtk-shell.h
          grep -Fq 'link_gtk_show_about(' platform/linux/link-gtk-about.c
          grep -Fq 'link_windows_show_about(' platform/windows/link-windows-about.c
          grep -Fq 'LINK_PRODUCT_FONT_UI' platform/windows/link-windows-about.c
          grep -Fq 'LINK_THEME_BACKGROUND' platform/windows/link-windows-about.c
          grep -Fq 'link_windows_about_apply_nonclient' platform/windows/link-windows-about.c
          grep -Fq 'link_windows_about_prepare_child' platform/windows/link-windows-about.c
          grep -Fq 'struct LinkDiagnosticAboutInfo' platform/apple/LinkDiagnosticUI.swift
          grep -Fq 'struct LinkDiagnosticAboutView' platform/apple/LinkDiagnosticUI.swift
          grep -Fq 'struct LinkDiagnosticAboutButton' platform/apple/LinkDiagnosticUI.swift
          grep -Fq 'class LinkStandardProductViewModel' platform/apple/LinkDiagnosticUI.swift
          grep -Fq 'struct LinkStandardProductAppearance' platform/apple/LinkDiagnosticUI.swift
          grep -Fq 'struct LinkStandardProductContentView' platform/apple/LinkDiagnosticUI.swift
          grep -Fq 'Dashboard measurements' platform/apple/LinkDiagnosticUI.swift
          grep -Fq 'enum LinkConnectionPresentation' platform/apple/LinkDiagnosticUI.swift
          grep -Fq '@interface LinkProductDiagnosticsController' platform/apple/LinkDiagnosticsController.h
          grep -Fq '@implementation LinkProductDiagnosticsController' platform/apple/LinkDiagnosticsController.m
          grep -Fq 'bool use_client_side_titlebar;' platform/linux/link-gtk-shell.h
          if grep -Fq 'adapter_combo_width' platform/linux/link-gtk-shell.h; then
            echo 'Adapter-selector geometry must be Link-owned, not product-configurable.' >&2
            exit 1
          fi
          grep -Fq 'gtk_widget_set_hexpand(shell->device_combo, TRUE);' platform/linux/link-gtk-shell.c
          grep -Fq 'gtk_widget_set_halign(shell->device_combo, GTK_ALIGN_FILL);' platform/linux/link-gtk-shell.c
          grep -Fq '.link-card { border: 1px solid transparent; border-radius: 12px; padding: 18px; }' platform/linux/link-gtk-shell.c
          grep -Fq '.link-link-button { min-width: 92px; padding: 7px 18px; border-radius: 10px; font-size: 13px; font-weight: 800; }' platform/linux/link-gtk-shell.c
          grep -Fq 'gtk_window_set_titlebar(shell->window, titlebar);' platform/linux/link-gtk-shell.c
          grep -Fq 'gtk_header_bar_set_show_title_buttons(GTK_HEADER_BAR(titlebar), TRUE);' platform/linux/link-gtk-shell.c
          grep -Fq 'gtk_widget_add_css_class(device_row, "link-device-row");' platform/linux/link-gtk-shell.c
          grep -Fq 'native protocol capture' platform/linux/link-gtk-shell.c
          grep -Fq 'transport.isNativeAdapter' platform/apple/LinkDiagnosticsController.m
          grep -Fq 'case settings' platform/apple/LinkDiagnosticUI.swift
          grep -Fq 'linkDiagnosticLocalization' platform/apple/LinkDiagnosticUI.swift
          grep -Fq 'setSelectedLanguageTag' platform/apple/LinkDiagnosticsController.m
          grep -Fq 'setSelectedMeasurementSystemKey' platform/apple/LinkDiagnosticsController.m
          grep -Fq '@property(nonatomic, copy, readonly) NSString *linkVersionText;' platform/apple/LinkDiagnosticsController.h
          grep -Fq 'return @LINK_VERSION_STRING;' platform/apple/LinkDiagnosticsController.m
          grep -Fq 'structuredDisplayValueForPID' platform/apple/LinkDiagnosticsController.m
          if grep -Eqi 'Mercedes|Jaguar|MBLink|JAGLink' \
              platform/linux/link-gtk-i18n.c \
              platform/windows/link-discover-i18n.c \
              src/core/telemetry.c; then
            echo 'Generic presentation and telemetry code must not branch on product identity.' >&2
            exit 1
          fi
          ! grep -Fq 'LINK_BUILD_REFERENCE_PRODUCT_FACES' CMakeLists.txt
          ! grep -Fq 'LinkDiagnosticSettingsView' platform/apple/LinkDiagnosticUI.swift
          ! grep -Fq 'showUnavailableParameters' platform/apple/LinkDiagnosticsController.h
          ! grep -Fq 'settings.show_unavailable' src/core/i18n.c
          grep -Fq 'return @[@"metric", @"us-customary"];' platform/apple/LinkDiagnosticsController.m
          grep -Fq 'src/core/units.c' CMakeLists.txt
          grep -Fq 'link-test-units tests/test_units.c link-units' CMakeLists.txt
          grep -Fq 'NATIVE_RX' platform/apple/LinkAppleTelemetryRecorder.inc
          grep -Fq 'link-test-uds-dtc tests/test_uds_dtc.c link-uds-dtc' CMakeLists.txt
          grep -Fq 'link-test-uds-server tests/test_uds_server.c link-uds-server' CMakeLists.txt
          grep -Fq 'link-test-stm32-uds-server' CMakeLists.txt
          grep -Fq 'request_can_id = 0x7e0U' examples/stm32c092/issue-38-server/Src-main.c
          grep -Fq 'link_stm32c092_hal_start_standard_dual' examples/stm32c092/link-stm32c092-hal.c
          grep -Fq 'link-test-stm32-bxcan-hal' CMakeLists.txt
          grep -Fq 'link_stm32_bxcan_hal_start_standard_dual' examples/stm32-bxcan/link-stm32-bxcan-hal.c
          grep -Fq 'STM32F103, STM32F107 and STM32F767' examples/stm32-bxcan/README.md
          grep -Fq 'functional_address_enabled' platform/stm32/link-stm32-uds-server.h
          grep -Fq 'nrc == UINT8_C(0x31)' platform/stm32/link-stm32-uds-server.c
          grep -Fq 'request.can_id = 0x7dfU' tests/test_stm32_uds_server.c
          if grep -REn '\?[[:space:]]*:' platform/apple; then
            echo 'Apple platform code must not use the GNU omitted-middle ?: extension.' >&2
            exit 1
          fi

      - name: Configure
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure native Windows ARM64
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A ARM64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Exercise Apple profile persistence and simulation isolation
        if: runner.os == 'macOS'
        run: bash tests/apple/run-regressions.sh

      - name: Verify installed CMake package from an external consumer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/link-install"
          cmake --install build --prefix "$prefix"
          cmake -S tests/cmake-consumer -B package-consumer \
            -DCMAKE_PREFIX_PATH="$prefix"
          cmake --build package-consumer --parallel
          ./package-consumer/link-package-consumer

      - name: Verify the neutral shared scanner implementation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $link = Get-ChildItem -Path build -Recurse -Filter link-discover.exe | Select-Object -First 1
          if (-not $link) { throw 'link-discover.exe was not produced by Link' }
          if (-not (Test-Path platform/windows/link-discover.c)) { throw 'shared scanner backend is missing' }
          if (-not (Test-Path platform/windows/link-discover-ui.c)) { throw 'shared scanner UI shell is missing' }
          Write-Host "Link scanner: $($link.FullName)"

      - name: Seal exact tracked source with pinned dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          mkdir -p release
          touch .archive-should-not-ship
          trap 'rm -f .archive-should-not-ship' EXIT
          python3 scripts/archive-source.py "release/Link-$version-source.zip"
          python3 scripts/archive-source.py "$RUNNER_TEMP/link-source-again.zip"
          cmp "release/Link-$version-source.zip" "$RUNNER_TEMP/link-source-again.zip"
          python3 - "$version" <<'PY'
          import sys, zipfile
          from pathlib import Path
          with zipfile.ZipFile("release/Link-" + sys.argv[1] + "-source.zip") as archive:
              assert not any(".archive-should-not-ship" in name for name in archive.namelist())
              assert archive.read("Link-" + sys.argv[1] + "/src/infiltratr-common/VERSION") == Path("src/infiltratr-common/VERSION").read_bytes()
          PY
          printf '%s\n' "$GITHUB_SHA" > release/SOURCE_COMMIT
          (cd release && sha256sum *.zip SOURCE_COMMIT > SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: runner.os == 'Linux'
        with:
          name: link-source-${{ github.sha }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  linux-native-adapters:
    name: Linux / native adapter providers
    runs-on: [self-hosted, Linux, X64, linux-native]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native transport build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libbluetooth-dev libglib2.0-dev libusb-1.0-0-dev libgtk-4-dev pkg-config
      - name: Initialise Common
        shell: bash
        run: git submodule update --init src/infiltratr-common
      - name: Configure native provider ownership smoke
        run: cmake -S . -B build-linux-providers -DCMAKE_BUILD_TYPE=Release -DLINK_BUILD_LINUX_PROVIDER_SMOKE=ON -DBUILD_TESTING=ON
      - name: Compile native providers
        run: cmake --build build-linux-providers --target link-linux-provider-smoke link-test-linux-openport2-status --parallel
      - name: Compile the shared GTK presentation sources
        shell: bash
        run: |
          cc -std=c11 -fsyntax-only -Werror=implicit-function-declaration \
            $(pkg-config --cflags gtk4) \
            -Iinclude -Isrc/infiltratr-common/include -Iplatform/linux \
            -include platform/linux/link-gtk-i18n.h \
            platform/linux/link-gtk-shell.c \
            platform/linux/link-gtk-about.c \
            platform/linux/link-gtk-i18n.c
      - name: Verify OpenPort receive-status regression
        run: ctest --test-dir build-linux-providers -R '^link-linux-openport2-status$' --output-on-failure

  stm32-arm-cross:
    name: STM32 / Cortex-M cross-compile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialise Common
        shell: bash
        run: git submodule update --init src/infiltratr-common
      - name: Install ARM embedded GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Cross-compile STM32C092 source set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-stm32-arm
          flags=(
            -mcpu=cortex-m0plus -mthumb -std=c11 -ffreestanding
            -Wall -Wextra -Wpedantic -Wshadow -Wformat=2
            -Wstrict-prototypes -Wmissing-prototypes -Werror
            -Iinclude -Iplatform/stm32 -Iexamples/stm32c092
            -Itests/stm32c092_hal_stub -Isrc/infiltratr-common/include
          )
          sources=(
            src/core/isotp.c
            src/uds/uds.c
            src/uds/uds_services.c
            src/uds/uds_authentication.c
            src/uds/uds_dtc_lifecycle.c
            src/uds/uds_server.c
            src/infiltratr-common/src/core.c
            platform/stm32/link-stm32-can.c
            platform/stm32/link-stm32-uds.c
            platform/stm32/link-stm32-uds-server.c
            examples/stm32c092/link-stm32c092-hal.c
            examples/stm32c092/link-stm32c092-example.c
            examples/stm32c092/link-stm32c092-server-example.c
          )
          for source in "${sources[@]}"; do
            object="build-stm32-arm/$(printf '%s' "$source" | tr '/.' '__').o"
            arm-none-eabi-gcc "${flags[@]}" -c "$source" -o "$object"
          done
          arm-none-eabi-size build-stm32-arm/*.o

      - name: Compile exact STM32C092 issue-27 Cube main
        shell: bash
        run: |
          set -euo pipefail
          flags=(
            -mcpu=cortex-m0plus -mthumb -std=c11 -ffreestanding
            -Wall -Wextra -Wpedantic -Wshadow -Wformat=2
            -Wstrict-prototypes -Wmissing-prototypes -Werror
            -Iinclude -Iplatform/stm32 -Iexamples/stm32c092
            -Itests/stm32c092_issue27_stub -Itests/stm32c092_hal_stub
            -Isrc/infiltratr-common/include
          )
          arm-none-eabi-gcc "${flags[@]}"             -c examples/stm32c092/issue-27/Src-main.c             -o build-stm32-arm/issue27_Src-main.o

      - name: Cross-compile STM32F103/F107/F767 bxCAN source set
        shell: bash
        run: |
          set -euo pipefail
          sources=(
            src/core/isotp.c
            src/crypto/aes_cmac.c
            src/uds/uds.c
            src/uds/uds_services.c
            src/uds/uds_authentication.c
            src/uds/uds_dtc_lifecycle.c
            src/uds/uds_server.c
            src/infiltratr-common/src/core.c
            platform/stm32/link-stm32-can.c
            platform/stm32/link-stm32-uds.c
            platform/stm32/link-stm32-uds-server.c
            examples/stm32-bxcan/link-stm32-bxcan-hal.c
            examples/stm32-bxcan/link-stm32-bxcan-tester-example.c
            examples/stm32-bxcan/link-stm32f103-uds-ecu.c
          )
          for cpu in cortex-m3 cortex-m7; do
            output="build-stm32-bxcan-${cpu}"
            mkdir -p "$output"
            flags=(
              "-mcpu=${cpu}" -mthumb -std=c11 -ffreestanding
              -Wall -Wextra -Wpedantic -Wshadow -Wformat=2
              -Wstrict-prototypes -Wmissing-prototypes -Werror
              -Iinclude -Iplatform/stm32 -Iexamples/stm32-bxcan
              -Itests/stm32_bxcan_hal_stub -Isrc/infiltratr-common/include
            )
            for source in "${sources[@]}"; do
              object="$output/$(printf '%s' "$source" | tr '/.' '__').o"
              arm-none-eabi-gcc "${flags[@]}" -c "$source" -o "$object"
            done
            arm-none-eabi-size "$output"/*.o
          done

      - name: Compile standalone STM32F103 flash journal exercise
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-stm32-flash-journal
          flags=(
            -mcpu=cortex-m3 -mthumb -std=c11 -ffreestanding
            -Wall -Wextra -Wpedantic -Wshadow -Wformat=2
            -Wstrict-prototypes -Wmissing-prototypes -Werror
            -Iinclude -Itests/stm32_flash_journal_stub
          )
          arm-none-eabi-gcc "${flags[@]}" \
            -c examples/stm32-bxcan/flash-journal-standalone/Src-main.c \
            -o build-stm32-flash-journal/Src-main.o
          arm-none-eabi-gcc "${flags[@]}" \
            -c src/core/flash_journal.c \
            -o build-stm32-flash-journal/flash_journal.o
          arm-none-eabi-size build-stm32-flash-journal/*.o

  sanitizers:
    name: Linux / ASan + UBSan
    runs-on: [self-hosted, Linux, X64, linux-native]
    timeout-minutes: 20
    steps:
      - name: Provide Git on self-hosted Linux
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          if command -v git >/dev/null; then exit 0; fi
          root="$RUNNER_TEMP/link-git"
          mkdir -p "$root/packages"
          cd "$root/packages"
          apt-get download git
          dpkg-deb -x ./*.deb "$root"
          "$root/usr/bin/git" --version
          echo "$root/usr/bin" >> "$GITHUB_PATH"
          echo "GIT_EXEC_PATH=$root/usr/lib/git-core" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Provide CMake on self-hosted Linux
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          if command -v cmake >/dev/null; then exit 0; fi
          root="$RUNNER_TEMP/link-cmake"
          mkdir -p "$root/packages"
          cd "$root/packages"
          apt-get download cmake cmake-data librhash0 libjsoncpp25 libuv1t64
          for deb in ./*.deb; do dpkg-deb -x "$deb" "$root"; done
          export LD_LIBRARY_PATH="$root/usr/lib/x86_64-linux-gnu${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          "$root/usr/bin/cmake" --version
          echo "$root/usr/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
      - name: Initialise Common
        shell: bash
        run: git submodule update --init src/infiltratr-common
      - name: Configure sanitizers
        run: cmake -S . -B build-sanitized -DCMAKE_BUILD_TYPE=Debug -DLINK_ENABLE_SANITIZERS=ON
      - name: Build sanitizers
        run: cmake --build build-sanitized --parallel
      - name: Test sanitizers
        run: ctest --test-dir build-sanitized --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
